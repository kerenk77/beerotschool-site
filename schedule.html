<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расписание — Онлайн школа "Беерот Ицхак"</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #3580BB 100%);
      color: #333;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 2rem;
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      text-align: center;
      color: #4a5568;
      margin-bottom: 2rem;
      font-size: clamp(1.3rem, 5vw, 2rem);
    }
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 5px;
    }
    .hamburger div {
      width: 25px;
      height: 3px;
      background: #333;
      border-radius: 2px;
    }
    @media (max-width: 768px) {
      .nav-links {
        position: absolute;
        top: 60px;
        right: 0;
        background: white;
        flex-direction: column;
        width: 200px;
        padding: 1rem;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        display: none;
      }
      .nav-links.active { display: flex; }
      .hamburger { display: flex; }
    }

    /* === расписание === */
    #schedule {
      max-width: 1100px;
      margin: 2rem auto;
      font-family: Arial, sans-serif;
    }
    .schedule-status {
      text-align: center;
      color: #718096;
      padding: 1rem;
      font-size: 1rem;
    }
    .schedule-status.error { color: #e53e3e; }

    .class-title {
      text-align: center;
      font-weight: bold;
      font-size: 1.3rem;
      padding: 0.6rem;
      margin: 1.6rem 0 0.8rem;
      border-radius: 10px;
      color: #fff;
    }
    .class-title.male { background: #4c79f0; }
    .class-title.female { background: #ff7eb3; }

    /* ============================================================
       ГЛАВНОЕ ДЕЛЕНИЕ — ПО ДНЯМ.
       На каждый класс — набор карточек, одна карточка = один день
       недели. Внутри карточки — список "время: предмет (учитель)"
       по порядку, как в таблице на Google Диске.
       На широком экране карточки дней стоят в ряд, как неделя;
       на телефоне (см. медиа-запрос ниже) — идут одна под другой.
       ============================================================ */
    .days-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin: 0 0 1.5rem;
    }
    .day-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      text-align: left;
    }
    .day-card-header {
      background: #eef1fb;
      color: #2d3748;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 10px 14px;
      text-align: center;
    }
    .day-card-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 10px;
      padding: 8px 14px;
      border-bottom: 1px dashed #edf2f7;
      font-size: 0.95rem;
    }
    .day-card-row:last-child { border-bottom: none; }
    .day-card-time {
      font-weight: 700;
      color: #4c79f0;
      flex-shrink: 0;
      font-size: 0.85rem;
    }
    .day-card-subject { color: #2d3748; }
    .teacher-name {
      display: block;
      width: 100%;
      font-size: 0.82em;
      font-style: italic;
      color: #718096;
      margin-top: -2px;
    }
    .day-card-empty {
      padding: 14px;
      color: #a0aec0;
      font-style: italic;
      font-size: 0.9rem;
      text-align: center;
    }

    @media (max-width: 640px) {
      .container {
        margin: 0;
        padding: 1.2rem 0.8rem;
        border-radius: 0;
        box-shadow: none;
      }
      #schedule { margin: 1rem auto; }
      .class-title { font-size: 1.1rem; }
      /* на телефоне — один день под другим, никакого горизонтального сжатия */
      .days-grid { grid-template-columns: 1fr; gap: 12px; }
    }
  </style>
</head>
<body>
  <!-- Меню -->
  <header id="siteHeader"></header>
  <script src="menu.js"></script>

  <!-- Контент -->
  <div class="container">
    <h1>Расписание занятий</h1>
    <div id="schedule">
      <p class="schedule-status">Загрузка расписания...</p>
    </div>
  </div>

  <script>
    async function loadSchedule() {
      const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRXRBl4YNIksCcl6axtnLh6Dy5mFcvhraY4D17cr3UtpEMX8K7ypVvLc7WHLdM0ypBbAh3LZcCq97Lv/pub?gid=507837118&single=true&output=tsv";
      const container = document.getElementById("schedule");

      let text;
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("HTTP " + response.status);
        text = await response.text();
      } catch (err) {
        container.innerHTML = '<p class="schedule-status error">Не удалось загрузить расписание. Проверьте интернет-соединение и обновите страницу.</p>';
        return;
      }

      const rows = text.trim().split("\n").map(r => r.split("\t").map(c => c.trim()));

      // --- Проход 1: разбираем TSV в структуру { title, days, times } ---
      // times[i] = { time, cells: [ {subject, teacher}, ... ] } — по одной ячейке на день,
      // в том же порядке, что и колонки после "Время" в таблице на Google Диске.
      const blocks = [];
      let current = null;
      let headers = [];      // текущая строка "Время ..." (задаёт дни-колонки)
      let pendingRow = null; // последняя добавленная time-строка — для приклейки учителя

      rows.forEach(trimmed => {
        const nonEmpty = trimmed.filter(c => c !== "").length;

        // --- заголовок класса ---
        if (nonEmpty === 1 && trimmed[0] !== "") {
          current = { title: trimmed[0], days: [], times: [] };
          blocks.push(current);
          headers = [];
          pendingRow = null;
        }
        // --- строка "Время ..." — задаёт список дней-колонок для блока ниже ---
        else if (trimmed[0] && trimmed[0].toLowerCase().startsWith("время")) {
          headers = trimmed;
          if (current) current.days = trimmed.slice(1);
          pendingRow = null;
        }
        // --- строка-продолжение (имя учителя): первая колонка пустая ---
        else if (trimmed[0] === "" && nonEmpty > 0 && pendingRow) {
          trimmed.forEach((cell, i) => {
            if (i === 0 || cell === "") return;
            const dayIdx = i - 1;
            if (pendingRow.cells[dayIdx]) pendingRow.cells[dayIdx].teacher = cell;
          });
        }
        // --- обычная строка расписания (время + предмет на каждый день) ---
        else if (nonEmpty > 0 && current) {
          const dayCount = Math.max(headers.length, trimmed.length) - 1;
          const cells = [];
          for (let i = 0; i < dayCount; i++) {
            cells.push({ subject: trimmed[i + 1] || "", teacher: "" });
          }
          const timeEntry = { time: trimmed[0], cells: cells };
          current.times.push(timeEntry);
          pendingRow = timeEntry;
        }
      });

      // --- Проход 2: рисуем по дням ---
      container.innerHTML = "";
      blocks.forEach(block => {
        const title = document.createElement("div");
        title.className = "class-title";
        const lower = block.title.toLowerCase();
        title.classList.add(lower.includes("девочки") || lower.includes("мора") ? "female" : "male");
        title.textContent = block.title;
        container.appendChild(title);

        const grid = document.createElement("div");
        grid.className = "days-grid";

        block.days.forEach((day, dayIdx) => {
          const dayCard = document.createElement("div");
          dayCard.className = "day-card";

          const header = document.createElement("div");
          header.className = "day-card-header";
          header.textContent = day;
          dayCard.appendChild(header);

          const entries = block.times
            .map(t => ({ time: t.time, subject: t.cells[dayIdx] ? t.cells[dayIdx].subject : "", teacher: t.cells[dayIdx] ? t.cells[dayIdx].teacher : "" }))
            .filter(e => e.subject !== "");

          if (entries.length === 0) {
            const empty = document.createElement("div");
            empty.className = "day-card-empty";
            empty.textContent = "Занятий нет";
            dayCard.appendChild(empty);
          } else {
            entries.forEach(e => {
              const row = document.createElement("div");
              row.className = "day-card-row";

              const timeSpan = document.createElement("span");
              timeSpan.className = "day-card-time";
              timeSpan.textContent = e.time;
              row.appendChild(timeSpan);

              const subjSpan = document.createElement("span");
              subjSpan.className = "day-card-subject";
              subjSpan.textContent = e.subject;
              row.appendChild(subjSpan);

              if (e.teacher) {
                const teacherSpan = document.createElement("span");
                teacherSpan.className = "teacher-name";
                teacherSpan.textContent = e.teacher;
                row.appendChild(teacherSpan);
              }

              dayCard.appendChild(row);
            });
          }

          grid.appendChild(dayCard);
        });

        container.appendChild(grid);
      });
    }
    loadSchedule();
  </script>
</body>
</html>
