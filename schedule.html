<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расписание — Онлайн школа "Беерот Ицхак"</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #3580BB 100%);
      color: #333;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 2rem;
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      text-align: center;
      color: #4a5568;
      margin-bottom: 2rem;
      font-size: clamp(1.3rem, 5vw, 2rem);
    }
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 5px;
    }
    .hamburger div {
      width: 25px;
      height: 3px;
      background: #333;
      border-radius: 2px;
    }
    @media (max-width: 768px) {
      .nav-links {
        position: absolute;
        top: 60px;
        right: 0;
        background: white;
        flex-direction: column;
        width: 200px;
        padding: 1rem;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        display: none;
      }
      .nav-links.active { display: flex; }
      .hamburger { display: flex; }
    }

    /* === расписание === */
    #schedule {
      max-width: 1000px;
      margin: 2rem auto;
      font-family: Arial, sans-serif;
    }
    .schedule-status {
      text-align: center;
      color: #718096;
      padding: 1rem;
      font-size: 1rem;
    }
    .schedule-status.error { color: #e53e3e; }

    .class-title {
      text-align: center;
      font-weight: bold;
      font-size: 1.3rem;
      padding: 0.6rem;
      margin: 1rem 0 0.5rem;
      border-radius: 10px;
      color: #fff;
    }
    .class-title.male { background: #4c79f0; }
    .class-title.female { background: #ff7eb3; }

    /* --- разметка "как в таблице" (планшет/десктоп) --- */
    .schedule-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 4px;
      margin: 2px 0;
    }
    .cell {
      background: #f0f4ff;
      padding: clamp(4px, 1vw, 8px);
      border-radius: 6px;
      text-align: center;
      font-size: clamp(0.75rem, 1.6vw, 0.95rem);
      overflow-wrap: break-word;
    }
    .time-header .cell {
      background: #cfd8e3;
      font-weight: bold;
    }
    .cell.bold-number { font-weight: bold; }

    /* строка предмета и строка учителя под ней в таблице на Google Диске
       склеиваются в одну ячейку: предмет — обычным текстом, учитель —
       отдельной строкой помельче и посветлее под ним */
    .teacher-name {
      display: block;
      font-size: 0.85em;
      font-style: italic;
      color: #718096;
      margin-top: 2px;
    }

    /* ============================================================
       МОБИЛЬНЫЕ ЭКРАНЫ (узкие телефоны)
       Вместо того чтобы сжимать таблицу в кучу нечитаемых колонок,
       каждая строка расписания превращается в отдельную "карточку":
       первая ячейка строки (время или день) становится заголовком
       карточки, а остальные ячейки подписываются названием своей
       колонки (берётся из строки "Время ..."), например:
         09:00
         Воскресенье: Математика
         Понедельник: Тора
       Так на телефоне видно не просто голые цифры, а понятно что
       к чему относится, и не нужно листать таблицу вбок.
       ============================================================ */
    @media (max-width: 640px) {
      .container {
        margin: 0;
        padding: 1.2rem 0.8rem;
        border-radius: 0;
        box-shadow: none;
      }
      #schedule { margin: 1rem auto; }

      .class-title { font-size: 1.1rem; }

      /* строку с "Время ..." прячем — её данные уже видны как подписи внутри карточек */
      .schedule-row.time-header { display: none; }

      .schedule-row:not(.time-header) {
        display: block;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 10px 14px;
        margin: 10px 0;
        box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        text-align: left;
      }

      .schedule-row:not(.time-header) .cell {
        display: block;
        background: none;
        border-radius: 0;
        padding: 6px 0;
        text-align: left;
        font-size: 0.95rem;
        border-bottom: 1px dashed #edf2f7;
      }
      .schedule-row:not(.time-header) .cell:last-child {
        border-bottom: none;
      }

      /* пустые ячейки (нет урока в этот день/время) на телефоне просто скрываем */
      .schedule-row:not(.time-header) .cell.empty {
        display: none;
      }

      /* первая ячейка строки — как заголовок карточки */
      .schedule-row:not(.time-header) .cell:first-child {
        font-weight: 700;
        font-size: 1.05rem;
        color: #2d3748;
        border-bottom: 2px solid #cbd5e0;
        padding-bottom: 8px;
        margin-bottom: 4px;
      }

      /* подпись колонки (например название дня) перед значением, в одну строку с предметом */
      .schedule-row:not(.time-header) .cell:not(:first-child)::before {
        content: attr(data-label) ": ";
        font-weight: 600;
        color: #718096;
      }
    }
  </style>
</head>
<body>
  <!-- Меню -->
  <header id="siteHeader"></header>
  <script src="menu.js"></script>

  <!-- Контент -->
  <div class="container">
    <h1>Расписание занятий</h1>
    <div id="schedule">
      <p class="schedule-status">Загрузка расписания...</p>
    </div>
  </div>

  <script>
    async function loadSchedule() {
      const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRXRBl4YNIksCcl6axtnLh6Dy5mFcvhraY4D17cr3UtpEMX8K7ypVvLc7WHLdM0ypBbAh3LZcCq97Lv/pub?gid=507837118&single=true&output=tsv";
      const container = document.getElementById("schedule");

      let text;
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("HTTP " + response.status);
        text = await response.text();
      } catch (err) {
        container.innerHTML = '<p class="schedule-status error">Не удалось загрузить расписание. Проверьте интернет-соединение и обновите страницу.</p>';
        return;
      }

      container.innerHTML = "";
      const rows = text.trim().split("\n").map(r => r.split("\t"));

      // подписи колонок для текущего блока расписания (обновляются на каждой строке "Время ...")
      let headers = [];
      // ячейки последней "обычной" строки расписания — нужны, чтобы подклеить
      // к ним строку с именем учителя, которая в таблице идёт следующей строкой
      // без времени в первой колонке
      let lastRowCells = null;

      rows.forEach(row => {
        const trimmed = row.map(c => c.trim());
        const nonEmpty = trimmed.filter(c => c !== "").length;

        // --- заголовок класса ---
        if (nonEmpty === 1 && trimmed[0] !== "") {
          lastRowCells = null;
          const title = document.createElement("div");
          title.className = "class-title";
          if (trimmed[0].toLowerCase().includes("девочки") || trimmed[0].toLowerCase().includes("мора")) {
            title.classList.add("female");
          } else {
            title.classList.add("male");
          }
          title.textContent = trimmed[0];
          container.appendChild(title);
        }
        // --- строка "Время ..." (задаёт подписи для колонок ниже) ---
        else if (trimmed[0] && trimmed[0].toLowerCase().startsWith("время")) {
          lastRowCells = null;
          headers = trimmed;
          const line = document.createElement("div");
          line.className = "schedule-row time-header";
          trimmed.forEach(cell => {
            const div = document.createElement("div");
            div.className = "cell";
            if (/\d/.test(cell)) div.classList.add("bold-number");
            div.textContent = cell;
            line.appendChild(div);
          });
          container.appendChild(line);
        }
        // --- строка-продолжение (имя учителя): первая колонка пустая, а строка
        //     с предметом для этого времени уже была нарисована непосредственно перед этим ---
        else if (trimmed[0] === "" && nonEmpty > 0 && lastRowCells) {
          trimmed.forEach((cell, i) => {
            if (cell === "" || !lastRowCells[i]) return;
            const targetCell = lastRowCells[i];
            const teacher = document.createElement("span");
            teacher.className = "teacher-name";
            teacher.textContent = cell;
            targetCell.appendChild(teacher);
            targetCell.classList.remove("empty");
          });
        }
        // --- обычная строка расписания ---
        else if (nonEmpty > 0) {
          const line = document.createElement("div");
          line.className = "schedule-row";
          const rowCells = [];
          trimmed.forEach((cell, i) => {
            const div = document.createElement("div");
            div.className = "cell";
            if (cell === "") div.classList.add("empty");
            if (/\d/.test(cell)) div.classList.add("bold-number");
            // подпись колонки (для мобильной карточки), берём из последней строки "Время ..."
            if (headers[i]) div.dataset.label = headers[i];
            const subject = document.createElement("span");
            subject.className = "subject-text";
            subject.textContent = cell;
            div.appendChild(subject);
            line.appendChild(div);
            rowCells.push(div);
          });
          container.appendChild(line);
          lastRowCells = rowCells;
        }
      });
    }
    loadSchedule();
  </script>
</body>
</html>
